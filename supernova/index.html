<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nebula Player</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

/* CANVAS NEBULA */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* BUTTON FUTURISTIK */
#startBtn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 40px;
  font-size: 18px;
  color: white;
  background: transparent;
  border: 2px solid white;
  cursor: pointer;
  letter-spacing: 2px;
  transition: 0.3s;
}

#startBtn:hover {
  background: white;
  color: black;
  box-shadow: 0 0 20px white;
}

/* LASER LINE */
#laser {
  position: absolute;
  bottom: 20px;
  left: 0;
  width: 100%;
  height: 3px;
  overflow: hidden;
}

#laser::before {
  content: "";
  position: absolute;
  left: -100px;
  width: 100px;
  height: 100%;
  background: white;
  box-shadow: 0 0 15px white;
  animation: laserMove 1.5s linear infinite;
}

@keyframes laserMove {
  from { left: -100px; }
  to { left: 100%; }
}
</style>
</head>

<body>

<canvas id="nebula"></canvas>
<button id="startBtn">START</button>
<div id="laser"></div>

<audio id="music" src="https://school.rsynzr.cloud/src/rapsodi.webm"></audio>

<script>
const canvas = document.getElementById("nebula");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 120; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 2,
    dx: (Math.random() - 0.5) * 0.5,
    dy: (Math.random() - 0.5) * 0.5
  });
}

function drawNebula() {
  ctx.fillStyle = "rgba(0,0,20,0.3)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(180, 100, 255, 0.8)";
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
  });

  requestAnimationFrame(drawNebula);
}

drawNebula();

/* INTERAKSI START */
document.getElementById("startBtn").onclick = () => {
  document.getElementById("music").play();
  document.getElementById("startBtn").style.display = "none";
};
</script>

</body>
</html>
