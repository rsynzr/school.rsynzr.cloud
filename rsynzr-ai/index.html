<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="rsynzr-ai chatbot berbasis Groq API dan Cloudflare Workers.">
  <title>rsynzr-ai</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="../" aria-label="Kembali ke school.rsynzr.cloud">
        <span class="brand-mark">r</span>
        <span>
          <strong>rsynzr-ai</strong>
          <small>Groq chatbot</small>
        </span>
      </a>

      <div class="topbar-actions">
        <button class="icon-button" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel" title="Settings">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path>
            <path d="M19.4 13.5a7.9 7.9 0 0 0 .05-1.5l2-1.55-2-3.46-2.4.96a8 8 0 0 0-1.3-.75L15.4 4h-4l-.35 3.2c-.46.2-.9.45-1.3.75l-2.4-.96-2 3.46 2 1.55a7.9 7.9 0 0 0 .05 1.5l-2.05 1.6 2 3.46 2.46-.98c.38.28.8.5 1.24.68l.35 3.24h4l.35-3.24c.44-.18.86-.4 1.24-.68l2.46.98 2-3.46-2.05-1.6Z"></path>
          </svg>
          <span class="sr-only">Settings</span>
        </button>
        <button class="ghost-button" id="clearChat" type="button">Clear</button>
      </div>
    </header>

    <section class="settings-panel" id="settingsPanel" aria-label="Chat settings" hidden>
      <label class="field">
        <span>Worker endpoint</span>
        <input id="endpointInput" type="url" inputmode="url" autocomplete="url" placeholder="https://your-worker.your-name.workers.dev/chat">
      </label>

      <label class="field">
        <span>System prompt</span>
        <textarea id="systemPrompt" rows="3" maxlength="2000" placeholder="Kamu adalah asisten AI yang ringkas, akurat, dan ramah."></textarea>
      </label>

      <label class="range-field">
        <span>Temperature <output id="temperatureValue" for="temperatureInput">0.7</output></span>
        <input id="temperatureInput" type="range" min="0" max="2" step="0.1" value="0.7">
      </label>
    </section>

    <section class="chat-panel" aria-label="Chat conversation">
      <div class="messages" id="messages" aria-live="polite"></div>
    </section>

    <form class="composer" id="chatForm">
      <div class="composer-box">
        <textarea id="messageInput" rows="1" maxlength="6000" autocomplete="off" placeholder="Tulis pesan..."></textarea>
        <button class="send-button" id="sendButton" type="submit" title="Kirim pesan" aria-label="Kirim pesan">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </button>
      </div>
      <p class="status-line" id="statusLine" role="status"></p>
    </form>
  </main>

  <template id="messageTemplate">
    <article class="message">
      <div class="avatar" aria-hidden="true"></div>
      <div class="bubble-wrap">
        <div class="bubble"></div>
        <div class="message-meta">
          <time></time>
          <button class="copy-button" type="button">Copy</button>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
